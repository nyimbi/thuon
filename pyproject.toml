[project]
name = "thuon"
version = "0.1.0"
description = "AI-powered modular business capability platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "blinker>=1.9.0",
    "feedparser>=6.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "schedule>=1.2.2",
    "tavily-python>=0.3.0",
    "weaviate-client>=4.0.0",
    "pytest>=8.0.0",
    "pytest-httpserver>=1.0.0",
    "reportlab>=4.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=1.9.0",
    "uuid6>=2024.1.12",
    "icalendar>=5.0.0",
    "ddgs>=9.14.4",
    "pywebview>=5.0.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.0",
    "pyobjc-framework-applicationservices>=10.0",
    # Optional tools dependencies
    "openai-whisper",
    "matplotlib",
    "chromadb",
    "playwright",
    "paramiko>=3.0.0",
]

[tool.pyright]
# The tests import the platform as a namespace package (`core.x`, `thuon`),
# which is how PYTHONPATH=thuon_platform makes them run. Without this the
# checker reports 329 unresolvable imports and hides the real diagnostics.
extraPaths = ["thuon_platform"]

[tool.pytest.ini_options]
pythonpath = ["thuon_platform"]
# Both suites. Listing only thuon_platform/tests/ci meant the root suite never
# ran under a bare `pytest`, so drift accumulated in files no gate touched.
testpaths  = ["tests/ci", "thuon_platform/tests/ci"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The codebase is tab-indented by convention (see CLAUDE.md). ruff >=0.9 infers
# indentation and no longer takes `indent-style`, so the enforcement is the
# ignore list below rather than a formatter setting.

[tool.ruff.lint]
# Rules that catch defects, not style preferences. Import ordering (I001) and
# one-line-statement rules are excluded deliberately: the codebase uses tabs,
# semicolons in compact branches, and its own import grouping throughout.
select = ["F", "B", "E712", "E711", "E713", "E714", "E722"]
ignore = [
	"B008",   # function call in default arg — used deliberately for dependency injection
	"B904",   # raise-without-from inside except — existing style
	"F403",   # star imports in a few legacy modules
	"F405",   # names from star imports
	# Mutable argument defaults. Every one of the 36 sites is read-only, and
	# several are load-bearing: the web UI populates capability forms from
	# inspect.signature, and test_registry_contracts compares those defaults to
	# CAPABILITY_REGISTRY. Rewriting them as None sentinels would change what
	# the UI shows to fix a bug that is not there. tests/ci/test_mutable_defaults.py
	# is the gate that matters: it fails if any default is ever mutated.
	"B006",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
