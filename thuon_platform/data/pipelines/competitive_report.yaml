name: competitive_report
description: Full competitive intelligence report as PDF

steps:
  - name: research
    capability: research_assistant
    params:
      research_query: "competitive landscape {input.industry} {input.company}"
      depth: shallow

  - name: intel
    capability: competitive_intelligence_operative
    params:
      competitors:
        - "{input.company}"
      areas_of_focus: "{input.areas_of_focus}"

  - name: report
    capability: document_generator
    params:
      topic: "Competitive Analysis: {input.company} in {input.industry}"
      format: "{input.format}"
      doc_type: report
      context: "{steps.research.summary}"
